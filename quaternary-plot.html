<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quaternary Plot Explorer</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --ink: #1f2430;
    --ink-muted: #6b7280;
    --border: #e2e2df;
    --grid: #d8d8d4;
    --axis: #9a9a94;
    --live: #2563eb;
    --live-fill: #2563eb22;
    --set: #dc6b19;
    --set-fill: #dc6b1922;
    --accent-hover: #1d4ed8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 48px;
    gap: 20px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0;
  }
  .subtitle {
    color: var(--ink-muted);
    font-size: 13px;
    margin-top: -12px;
  }
  .layout {
    display: flex;
    gap: 28px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  #plotWrap {
    position: relative;
    touch-action: none;
    width: 460px;
    height: 460px;
    overflow: hidden;
  }
  #plotWrap canvas {
    display: block;
    border-radius: 8px;
    cursor: grab;
  }
  #plotWrap canvas:active {
    cursor: grabbing;
  }
  .vertex-label {
    position: absolute;
    font-size: 13px;
    font-weight: 600;
    transform: translate(-50%, -50%);
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(255,255,255,0.9), 0 -1px 2px rgba(255,255,255,0.9);
  }
  .hint {
    position: absolute;
    bottom: 8px;
    left: 8px;
    font-size: 11px;
    color: var(--ink-muted);
    pointer-events: none;
    background: rgba(255,255,255,0.7);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .controls {
    width: 260px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .slider-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .slider-row .label-line {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--ink-muted);
  }
  .slider-row .label-line .name {
    font-weight: 600;
    color: var(--ink);
  }
  .swatch {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 2px;
    margin-right: 6px;
    vertical-align: middle;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--live);
  }
  button#setBtn {
    background: var(--live);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button#setBtn:hover { background: var(--accent-hover); }
  #pointList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    max-height: 180px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  #pointList li {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    padding: 5px 8px;
    border-bottom: 1px solid var(--border);
  }
  #pointList li:last-child { border-bottom: none; }
  #pointList li:hover { background: var(--bg); }
  #pointList li .coords { flex: 1; color: var(--ink-muted); }
  #pointList li button {
    border: none;
    background: transparent;
    color: var(--ink-muted);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 2px 4px;
  }
  #pointList li button:hover { color: var(--set); }
  .empty-note { color: var(--ink-muted); font-size: 12px; font-style: italic; }
  .segmented {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .segmented button {
    flex: 1;
    border: none;
    background: var(--panel);
    color: var(--ink-muted);
    font-size: 12px;
    font-weight: 600;
    padding: 7px 4px;
    cursor: pointer;
    border-left: 1px solid var(--border);
  }
  .segmented button:first-child { border-left: none; }
  .segmented button.active {
    background: var(--ink);
    color: white;
  }
  .formula {
    font-size: 12px;
    color: var(--ink-muted);
    line-height: 1.5;
    min-height: 34px;
  }
  .formula b { color: var(--ink); }
  .calc-heading {
    font-size: 11px;
    font-weight: 700;
    margin-top: 8px;
  }
  .calc-heading:first-child { margin-top: 0; }
  .calc-row {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    color: var(--ink);
    padding: 1px 0;
    line-height: 1.5;
  }
  .calc-row .rowhead { white-space: nowrap; }
  .calc-row .swatch { margin-right: 5px; }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--ink);
    color: white;
    font-size: 11px;
    padding: 4px 7px;
    border-radius: 6px;
    transform: translate(-50%, -130%);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.08s ease;
  }
  footer.nav-links {
    font-size: 12px;
    color: var(--ink-muted);
  }
  footer.nav-links a {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: var(--border);
    text-underline-offset: 2px;
  }
  footer.nav-links a:hover {
    color: var(--accent-hover);
    text-decoration-color: var(--accent-hover);
  }
</style>
</head>
<body>
  <h1>Quaternary Plot Explorer</h1>
  <div class="subtitle">Drag to rotate &middot; click a face to place the point &middot; scroll to zoom &middot; shift+scroll to pull the point inward</div>

  <div class="layout">
    <div class="panel" id="plotWrap">
      <div class="tooltip" id="tooltip"></div>
      <div class="hint">drag = rotate &middot; click face = set point &middot; shift+scroll = pull inward</div>
    </div>

    <div class="panel controls">
      <div class="slider-row">
        <div class="label-line">
          <span class="name"><span class="swatch" style="background:#c0392b"></span>A</span>
          <span id="valA">25%</span>
        </div>
        <input type="range" id="sliderA" min="0" max="100" value="25">
      </div>
      <div class="slider-row">
        <div class="label-line">
          <span class="name"><span class="swatch" style="background:#1f6f43"></span>B</span>
          <span id="valB">25%</span>
        </div>
        <input type="range" id="sliderB" min="0" max="100" value="25">
      </div>
      <div class="slider-row">
        <div class="label-line">
          <span class="name"><span class="swatch" style="background:#22559c"></span>C</span>
          <span id="valC">25%</span>
        </div>
        <input type="range" id="sliderC" min="0" max="100" value="25">
      </div>
      <div class="slider-row">
        <div class="label-line">
          <span class="name"><span class="swatch" style="background:#8e44ad"></span>D</span>
          <span id="valD">25%</span>
        </div>
        <input type="range" id="sliderD" min="0" max="100" value="25">
      </div>

      <button id="setBtn">Add point (shortcut: 's')</button>

      <div>
        <div class="segmented">
          <button data-mode="face" class="active">From face</button>
          <button data-mode="corner">From corner</button>
          <button data-mode="both">Both</button>
        </div>
        <div class="formula" id="formulaText"></div>
      </div>

      <div>
        <div class="label-line" style="margin-bottom:6px;">
          <span class="name">Gridlines</span>
        </div>
        <div class="segmented">
          <button data-grid="all" class="active">All gridlines</button>
          <button data-grid="faces">Gridlines on faces</button>
          <button data-grid="none">None</button>
        </div>
      </div>

      <div>
        <div class="label-line" style="margin-bottom:6px;">
          <span class="name">Points</span>
          <span id="countLabel" style="color:var(--ink-muted);">0</span>
        </div>
        <ul id="pointList"></ul>
        <div class="empty-note" id="emptyNote">No points set yet.</div>
      </div>
    </div>
  </div>

  <footer class="nav-links">
    <a href="ternary-plot.html">Ternary</a> · Quaternary · <a href="nary-plot.html">N-ary</a>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function () {
  const W = 460, H = 460;
  const plotWrap = document.getElementById('plotWrap');
  const tooltip = document.getElementById('tooltip');

  const VERTEX_COLORS = { A: '#c0392b', B: '#1f6f43', C: '#22559c', D: '#8e44ad' };
  const KEYS = ['a', 'b', 'c', 'd'];

  // --- Regular tetrahedron vertices, centered at origin ---
  const RAW = {
    A: new THREE.Vector3(1, 1, 1),
    B: new THREE.Vector3(1, -1, -1),
    C: new THREE.Vector3(-1, 1, -1),
    D: new THREE.Vector3(-1, -1, 1),
  };
  const SCALE = 1.6;
  const V = {};
  for (const k in RAW) V[k] = RAW[k].clone().multiplyScalar(SCALE);

  // Faces: each keyed by the vertex it's opposite to (i.e. the 3 vertices it contains)
  const FACES = {
    A: ['B', 'C', 'D'],
    B: ['A', 'C', 'D'],
    C: ['A', 'B', 'D'],
    D: ['A', 'B', 'C'],
  };

  function barycentricToPoint3(a, b, c, d) {
    return new THREE.Vector3()
      .addScaledVector(V.A, a)
      .addScaledVector(V.B, b)
      .addScaledVector(V.C, c)
      .addScaledVector(V.D, d);
  }

  // Barycentric coords of point p within triangle (p0,p1,p2)
  function triBarycentric(p, p0, p1, p2) {
    const v0 = new THREE.Vector3().subVectors(p1, p0);
    const v1 = new THREE.Vector3().subVectors(p2, p0);
    const v2 = new THREE.Vector3().subVectors(p, p0);
    const d00 = v0.dot(v0), d01 = v0.dot(v1), d11 = v1.dot(v1);
    const d20 = v2.dot(v0), d21 = v2.dot(v1);
    const denom = d00 * d11 - d01 * d01;
    const v = (d11 * d20 - d01 * d21) / denom;
    const w = (d00 * d21 - d01 * d20) / denom;
    const u = 1 - v - w;
    return { u, v, w };
  }

  // --- Scene setup ---
  const scene = new THREE.Scene();
  scene.background = null;

  const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 100);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(W, H);
  plotWrap.insertBefore(renderer.domElement, plotWrap.firstChild);

  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
  dirLight.position.set(3, 4, 5);
  scene.add(dirLight);

  // Tetrahedron faces (translucent) + edges
  const positions = [];
  for (const key of Object.keys(FACES)) {
    const [k0, k1, k2] = FACES[key];
    positions.push(V[k0].x, V[k0].y, V[k0].z, V[k1].x, V[k1].y, V[k1].z, V[k2].x, V[k2].y, V[k2].z);
  }
  const tetraGeom = new THREE.BufferGeometry();
  tetraGeom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  tetraGeom.computeVertexNormals();

  const faceMaterial = new THREE.MeshLambertMaterial({
    color: 0xffffff, transparent: true, opacity: 0.10, side: THREE.DoubleSide, depthWrite: false,
  });
  const faceMesh = new THREE.Mesh(tetraGeom, faceMaterial);
  faceMesh.name = 'faceMesh';
  scene.add(faceMesh);

  const edgesGeom = new THREE.EdgesGeometry(tetraGeom);
  const edgesMat = new THREE.LineBasicMaterial({ color: 0x9a9a94 });
  scene.add(new THREE.LineSegments(edgesGeom, edgesMat));

  // Grid lines on each face, 10% intervals parallel to each edge
  const faceGridPoints = [];
  for (const key of Object.keys(FACES)) {
    const [k0, k1, k2] = FACES[key].map(k => V[k]);
    for (let i = 1; i < 10; i++) {
      const t = i / 10;
      const pairs = [
        [k0, k1, k0, k2],
        [k1, k0, k1, k2],
        [k2, k0, k2, k1],
      ];
      for (const [sa, sb, sc, sd] of pairs) {
        const p1 = new THREE.Vector3().lerpVectors(sa, sb, t);
        const p2 = new THREE.Vector3().lerpVectors(sc, sd, t);
        faceGridPoints.push(p1, p2);
      }
    }
  }
  const faceGridGeom = new THREE.BufferGeometry().setFromPoints(faceGridPoints);
  const faceGridMat = new THREE.LineBasicMaterial({ color: 0xe4e4e0, transparent: true, opacity: 0.35 });
  const faceGridObj = new THREE.LineSegments(faceGridGeom, faceGridMat);
  scene.add(faceGridObj);

  // Internal grid lines: a tetrahedron's 4 vertices pair into 3 pairs of *opposite*
  // edges (no shared vertex, e.g. AB & CD). A line joining a point on one edge to the
  // point at the same fraction on its opposite edge can't lie in any face plane (a face
  // only ever touches one edge of an opposite pair), so these chords genuinely cross
  // the solid's interior, unlike the (flawed) face-plane triangles this used to draw.
  const oppositeEdgePairs = [
    [['A', 'B'], ['C', 'D']],
    [['A', 'C'], ['B', 'D']],
    [['A', 'D'], ['B', 'C']],
  ];
  const internalGridPoints = [];
  for (const [[e1a, e1b], [e2a, e2b]] of oppositeEdgePairs) {
    for (let i = 1; i < 10; i++) {
      const t = i / 10;
      const p = new THREE.Vector3().lerpVectors(V[e1a], V[e1b], t);
      // Both t and (1-t) pairings, so the chords cross each other through the
      // interior instead of just running parallel (a fuller "grid" look).
      const q1 = new THREE.Vector3().lerpVectors(V[e2a], V[e2b], t);
      const q2 = new THREE.Vector3().lerpVectors(V[e2a], V[e2b], 1 - t);
      internalGridPoints.push(p, q1, p, q2);
    }
  }
  const internalGridGeom = new THREE.BufferGeometry().setFromPoints(internalGridPoints);
  const internalGridMat = new THREE.LineBasicMaterial({ color: 0xff0000 });
  const internalGridObj = new THREE.LineSegments(internalGridGeom, internalGridMat);
  scene.add(internalGridObj);

  function setGridMode(mode) {
    faceGridObj.visible = mode === 'all' || mode === 'faces';
    internalGridObj.visible = mode === 'all';
  }
  setGridMode('all');
  document.querySelectorAll('[data-grid]').forEach((btn) => {
    btn.addEventListener('click', () => {
      setGridMode(btn.dataset.grid);
      document.querySelectorAll('[data-grid]').forEach((b) => b.classList.toggle('active', b === btn));
    });
  });

  // Live point
  const liveSphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.07, 20, 20),
    new THREE.MeshLambertMaterial({ color: 0x2563eb })
  );
  scene.add(liveSphere);

  // Set points group
  const setPointsGroup = new THREE.Group();
  scene.add(setPointsGroup);

  // --- Construction overlay: visualizes how a/b/c/d are computed ---
  // Each barycentric weight can be read two equivalent ways:
  //  - "from face": how far P is from the opposite face, relative to the vertex's height
  //  - "from corner": how far along the vertex-through-P ray P sits before it reaches
  //    the opposite face
  const constructionGroup = new THREE.Group();
  scene.add(constructionGroup);
  let constructionMode = 'face';

  const CONSTRUCTION_VERTS = KEYS.map((k) => {
    const upper = k.toUpperCase();
    const [f0, f1, f2] = FACES[upper].map(fk => V[fk]);
    const plane = new THREE.Plane().setFromCoplanarPoints(f0, f1, f2);
    const footFromVertex = plane.projectPoint(V[upper], new THREE.Vector3());
    const height = V[upper].distanceTo(footFromVertex);
    const color = VERTEX_COLORS[upper];
    return { key: k, upper, X: V[upper], plane, footFromVertex, height, color, colorHex: parseInt(color.slice(1), 16) };
  });

  const METHOD_COLOR = { face: '#7c3aed', corner: '#0d9488' };
  const METHOD_COLOR_HEX = { face: 0x7c3aed, corner: 0x0d9488 };
  const formulaText = document.getElementById('formulaText');
  const FACE_TEMPLATE = 'value = distance(P, opposite face) ÷ height from vertex';
  const CORNER_TEMPLATE = 'value = 1 − |vertex→P| ÷ |vertex→Q|  (Q = where vertex-through-P hits the opposite face)';

  function pct(n) { return Math.round(n * 100) + '%'; }
  function un(n) { return n.toFixed(2); }

  function swatchRow(color, label, html) {
    return `<div class="calc-row"><span class="rowhead"><span class="swatch" style="background:${color}"></span><b>${label}</b> =</span> ${html}</div>`;
  }

  function addLine3(p1, p2, colorHex, opacity) {
    const geo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
    const mat = new THREE.LineBasicMaterial({ color: colorHex, transparent: opacity != null, opacity: opacity != null ? opacity : 1 });
    constructionGroup.add(new THREE.Line(geo, mat));
  }

  function addTick3(p, colorHex) {
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 8), new THREE.MeshBasicMaterial({ color: colorHex }));
    mesh.position.copy(p);
    constructionGroup.add(mesh);
  }

  function drawFaceConstruction(v, P, colorHex, colorCss) {
    const foot = v.plane.projectPoint(P, new THREE.Vector3());
    const d = foot.distanceTo(P);
    const value = v.height > 0 ? d / v.height : 0;
    addLine3(P, foot, colorHex);
    addTick3(foot, colorHex);
    return swatchRow(colorCss, v.upper, `${un(d)} / ${un(v.height)} = ${pct(value)}`);
  }

  function drawCornerConstruction(v, P, colorHex, colorCss) {
    const dir = new THREE.Vector3().subVectors(P, v.X);
    if (dir.lengthSq() < 1e-9) return '';
    dir.normalize();
    const ray = new THREE.Ray(v.X, dir);
    const Q = new THREE.Vector3();
    if (!ray.intersectPlane(v.plane, Q)) return '';
    const dXP = v.X.distanceTo(P);
    const dXQ = v.X.distanceTo(Q);
    const value = 1 - dXP / dXQ;
    addLine3(v.X, P, colorHex);
    addLine3(P, Q, colorHex, 0.55);
    addTick3(Q, colorHex);
    return swatchRow(colorCss, v.upper, `1 - ${un(dXP)} / ${un(dXQ)} = 1 - ${(dXP / dXQ).toFixed(2)} = ${pct(value)}`);
  }

  function renderConstruction(pointOverride) {
    constructionGroup.clear();
    const src = pointOverride || state;
    const P = barycentricToPoint3(src.a, src.b, src.c, src.d);
    const faceRows = [], cornerRows = [];

    CONSTRUCTION_VERTS.forEach((v) => {
      if (constructionMode === 'face') {
        faceRows.push(drawFaceConstruction(v, P, v.colorHex, v.color));
      } else if (constructionMode === 'corner') {
        cornerRows.push(drawCornerConstruction(v, P, v.colorHex, v.color));
      } else {
        faceRows.push(drawFaceConstruction(v, P, METHOD_COLOR_HEX.face, METHOD_COLOR.face));
        cornerRows.push(drawCornerConstruction(v, P, METHOD_COLOR_HEX.corner, METHOD_COLOR.corner));
      }
    });

    let html = '';
    if (faceRows.length) {
      html += `<div class="calc-heading" style="color:${METHOD_COLOR.face}">${FACE_TEMPLATE}</div>${faceRows.join('')}`;
    }
    if (cornerRows.length) {
      html += `<div class="calc-heading" style="color:${METHOD_COLOR.corner}">${CORNER_TEMPLATE}</div>${cornerRows.join('')}`;
    }
    formulaText.innerHTML = html;
  }

  document.querySelectorAll('.segmented button[data-mode]').forEach((btn) => {
    btn.addEventListener('click', () => {
      constructionMode = btn.dataset.mode;
      document.querySelectorAll('.segmented button[data-mode]').forEach((b) => b.classList.toggle('active', b === btn));
      renderConstruction();
    });
  });

  // Vertex labels (HTML overlay, billboarded via projection each frame)
  const labelEls = {};
  for (const key of Object.keys(V)) {
    const el = document.createElement('div');
    el.className = 'vertex-label';
    el.textContent = key;
    el.style.color = VERTEX_COLORS[key];
    plotWrap.appendChild(el);
    labelEls[key] = el;
  }

  const camDir = new THREE.Vector3();
  function updateLabels() {
    camera.getWorldDirection(camDir);
    for (const key of Object.keys(V)) {
      const toVertex = new THREE.Vector3().subVectors(V[key], camera.position);
      const inFront = toVertex.dot(camDir) > 0;
      if (!inFront) { labelEls[key].style.display = 'none'; continue; }
      const p = V[key].clone().project(camera);
      const x = (p.x * 0.5 + 0.5) * W;
      const y = (-p.y * 0.5 + 0.5) * H;
      labelEls[key].style.left = x + 'px';
      labelEls[key].style.top = y + 'px';
      labelEls[key].style.display = 'block';
    }
  }

  // --- Orbit camera (hand-rolled: drag to rotate, wheel to zoom) ---
  let radius = 6.2, theta = Math.PI * 0.28, phi = Math.PI * 0.32;
  function updateCamera() {
    const sinPhi = Math.sin(phi);
    camera.position.set(
      radius * sinPhi * Math.sin(theta),
      radius * Math.cos(phi),
      radius * sinPhi * Math.cos(theta)
    );
    camera.lookAt(0, 0, 0);
  }
  updateCamera();

  // --- State ---
  let state = { a: 0.25, b: 0.25, c: 0.25, d: 0.25 };
  const setPoints = [];

  const sliderEls = { a: document.getElementById('sliderA'), b: document.getElementById('sliderB'), c: document.getElementById('sliderC'), d: document.getElementById('sliderD') };
  const valEls = { a: document.getElementById('valA'), b: document.getElementById('valB'), c: document.getElementById('valC'), d: document.getElementById('valD') };
  const pointList = document.getElementById('pointList');
  const countLabel = document.getElementById('countLabel');
  const emptyNote = document.getElementById('emptyNote');

  function renderLivePoint() {
    const p = barycentricToPoint3(state.a, state.b, state.c, state.d);
    liveSphere.position.copy(p);
    renderConstruction();
  }

  function renderSliders() {
    const pa = Math.round(state.a * 100);
    const pb = Math.round(state.b * 100);
    const pc = Math.round(state.c * 100);
    const pd = 100 - pa - pb - pc;
    sliderEls.a.value = pa; sliderEls.b.value = pb; sliderEls.c.value = pc; sliderEls.d.value = pd;
    valEls.a.textContent = pa + '%';
    valEls.b.textContent = pb + '%';
    valEls.c.textContent = pc + '%';
    valEls.d.textContent = pd + '%';
  }

  function setState(a, b, c, d) {
    const sum = a + b + c + d;
    if (sum > 0) { a /= sum; b /= sum; c /= sum; d /= sum; }
    state = { a, b, c, d };
    renderLivePoint();
    renderSliders();
  }

  // Slider drag: adjust the other three proportionally to keep sum = 1
  function onSliderChange(which) {
    pullState = null; // manual slider input overrides any active face-pull
    const raw = { a: +sliderEls.a.value / 100, b: +sliderEls.b.value / 100, c: +sliderEls.c.value / 100, d: +sliderEls.d.value / 100 };
    const newVal = raw[which];
    const others = KEYS.filter(k => k !== which);
    const cur = state;
    const otherSum = others.reduce((s, k) => s + cur[k], 0);
    const remaining = 1 - newVal;
    const next = { a: 0, b: 0, c: 0, d: 0 };
    next[which] = newVal;
    if (otherSum > 0) {
      others.forEach(k => { next[k] = cur[k] / otherSum * remaining; });
    } else {
      others.forEach(k => { next[k] = remaining / others.length; });
    }
    setState(next.a, next.b, next.c, next.d);
  }

  KEYS.forEach(k => sliderEls[k].addEventListener('input', () => onSliderChange(k)));

  // --- Pointer interaction: drag = orbit, click (no drag) on a face = set point ---
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let dragging = false, dragMoved = false, lastX = 0, lastY = 0;

  function setNdcFromEvent(ev) {
    const rect = renderer.domElement.getBoundingClientRect();
    ndc.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
    ndc.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
  }

  // Picking a face gives only a boundary point (2 DOF from a 2D click). To reach the
  // interior (the 3rd DOF), we treat the tetrahedron as a cone over that face toward
  // the opposite vertex: every interior point lies on exactly one segment from some
  // face point to that vertex. Shift+scroll slides along that segment (see pullState).
  function pickFacePoint(ev) {
    setNdcFromEvent(ev);
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObject(faceMesh, false);
    if (!hits.length) return null;
    const hit = hits[0];
    const faceIdx = Math.floor(hit.faceIndex);
    const faceKey = Object.keys(FACES)[faceIdx]; // the vertex opposite this face
    const [k0, k1, k2] = FACES[faceKey].map(k => V[k]);
    const { u, v, w } = triBarycentric(hit.point, k0, k1, k2);
    const face = {};
    face[FACES[faceKey][0].toLowerCase()] = u;
    face[FACES[faceKey][1].toLowerCase()] = v;
    face[FACES[faceKey][2].toLowerCase()] = w;
    return { faceKey: faceKey.toLowerCase(), face };
  }

  // Active face-pull: a point picked on a face, plus how far it's been pulled (t)
  // toward that face's opposite vertex. null once the sliders are touched directly.
  let pullState = null;

  function applyPullState() {
    const { faceKey, face, t } = pullState;
    const next = { a: 0, b: 0, c: 0, d: 0 };
    next[faceKey] = t;
    KEYS.filter(k => k !== faceKey).forEach(k => { next[k] = face[k] * (1 - t); });
    setState(next.a, next.b, next.c, next.d);
  }

  renderer.domElement.addEventListener('pointerdown', (ev) => {
    dragging = true; dragMoved = false;
    lastX = ev.clientX; lastY = ev.clientY;
    renderer.domElement.setPointerCapture(ev.pointerId);
  });

  renderer.domElement.addEventListener('pointermove', (ev) => {
    if (dragging) {
      const dx = ev.clientX - lastX, dy = ev.clientY - lastY;
      if (Math.abs(dx) + Math.abs(dy) > 3) dragMoved = true;
      if (dragMoved) {
        theta -= dx * 0.008;
        phi = Math.max(0.12, Math.min(Math.PI - 0.12, phi - dy * 0.008));
        updateCamera();
      }
      lastX = ev.clientX; lastY = ev.clientY;
    } else {
      // Hover: show tooltip on set points
      setNdcFromEvent(ev);
      raycaster.setFromCamera(ndc, camera);
      const hits = raycaster.intersectObjects(setPointsGroup.children, false);
      if (hits.length) {
        const pt = hits[0].object.userData.pt;
        showTooltip(ev, pt);
      } else {
        hideTooltip();
      }
    }
  });

  renderer.domElement.addEventListener('pointerup', (ev) => {
    dragging = false;
    if (!dragMoved) {
      const picked = pickFacePoint(ev);
      if (picked) {
        pullState = { faceKey: picked.faceKey, face: picked.face, t: 0 };
        applyPullState();
      }
    }
  });

  renderer.domElement.addEventListener('pointerleave', hideTooltip);

  renderer.domElement.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    if (ev.shiftKey && pullState) {
      pullState.t = Math.max(0, Math.min(1, pullState.t + ev.deltaY * 0.0015));
      applyPullState();
      return;
    }
    radius = Math.max(3, Math.min(14, radius + ev.deltaY * 0.004));
    updateCamera();
  }, { passive: false });

  function highlightPoint(i) {
    const mesh = setPointsGroup.children[i];
    if (mesh) mesh.scale.setScalar(1.6);
    renderConstruction(setPoints[i]);
  }

  function unhighlightPoint(i) {
    const mesh = setPointsGroup.children[i];
    if (mesh) mesh.scale.setScalar(1);
    renderConstruction();
  }

  // Set Point
  function recordPoint() {
    const pt = { a: state.a, b: state.b, c: state.c, d: state.d };
    setPoints.push(pt);
    renderSetPoints();
  }

  function renderSetPoints() {
    setPointsGroup.clear();
    setPoints.forEach((pt) => {
      const p = barycentricToPoint3(pt.a, pt.b, pt.c, pt.d);
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.06, 16, 16),
        new THREE.MeshLambertMaterial({ color: 0xdc6b19 })
      );
      mesh.position.copy(p);
      mesh.userData.pt = pt;
      setPointsGroup.add(mesh);
    });

    pointList.innerHTML = '';
    setPoints.forEach((pt, i) => {
      const li = document.createElement('li');
      const coords = document.createElement('span');
      coords.className = 'coords';
      coords.textContent = `A ${Math.round(pt.a * 100)}% · B ${Math.round(pt.b * 100)}% · C ${Math.round(pt.c * 100)}% · D ${Math.round(pt.d * 100)}%`;
      const removeBtn = document.createElement('button');
      removeBtn.textContent = '✕';
      removeBtn.title = 'Remove';
      removeBtn.addEventListener('click', () => {
        setPoints.splice(i, 1);
        renderSetPoints();
      });
      li.appendChild(coords);
      li.appendChild(removeBtn);
      li.addEventListener('mouseenter', () => highlightPoint(i));
      li.addEventListener('mouseleave', () => unhighlightPoint(i));
      pointList.appendChild(li);
    });

    countLabel.textContent = setPoints.length;
    emptyNote.style.display = setPoints.length ? 'none' : 'block';
  }

  function showTooltip(ev, pt) {
    const rect = plotWrap.getBoundingClientRect();
    tooltip.style.left = (ev.clientX - rect.left) + 'px';
    tooltip.style.top = (ev.clientY - rect.top) + 'px';
    tooltip.textContent = `A ${Math.round(pt.a * 100)}% · B ${Math.round(pt.b * 100)}% · C ${Math.round(pt.c * 100)}% · D ${Math.round(pt.d * 100)}%`;
    tooltip.style.opacity = '1';
  }
  function hideTooltip() { tooltip.style.opacity = '0'; }

  document.getElementById('setBtn').addEventListener('click', recordPoint);
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 's' || ev.key === 'S') {
      ev.preventDefault();
      recordPoint();
    }
  });

  // --- Render loop ---
  function animate() {
    requestAnimationFrame(animate);
    updateLabels();
    renderer.render(scene, camera);
  }

  // init
  renderLivePoint();
  renderSliders();
  renderSetPoints();
  animate();
})();
</script>
</body>
</html>
